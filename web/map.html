<!DOCTYPE html>
<html>
<head>
    <title>Drone Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .detection-popup { max-width: 350px; }
        .detection-popup .image-container { position: relative; display: inline-block; }
        .detection-popup canvas { max-width: 100%; height: auto; border: 2px solid #ccc; }
        .detection-popup .info { margin-top: 10px; font-size: 13px; line-height: 1.6; }
        .detection-popup .info strong { color: #F44336; font-size: 14px; }
        .detection-popup .info-row { margin: 3px 0; }
        .checkpoint-popup { max-width: 320px; font-size: 13px; line-height: 1.6; }
        .checkpoint-popup strong { color: #00897B; font-size: 14px; }
        .checkpoint-popup .info-row { margin: 3px 0; }
        .checkpoint-popup .muted { color: #666; font-size: 12px; }
        .equipment-block { margin: 6px 0; padding: 6px 8px; border-left: 3px solid #FF9800;
                           background: #FFF8E1; border-radius: 3px; }
        .equipment-block .equipment-title { font-weight: bold; color: #E65100; }
        .equipment-block .equipment-grid { display: grid; grid-template-columns: auto 1fr;
                                           gap: 1px 8px; margin-top: 3px; font-size: 12px; }
        .equipment-block .equipment-label { color: #666; white-space: nowrap; }
        .equipment-block .equipment-value { color: #222; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Read initial view + tile source from query params passed by Qt.
        function getQueryParam(name) {
            var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
            return m ? decodeURIComponent(m[1]) : null;
        }

        // Initial center/zoom (defaults to AIT Pune if not supplied).
        var centerParam = getQueryParam('center');
        var initialCenter = centerParam
            ? centerParam.split(',').map(Number)
            : [18.6182667, 73.8767611];
        var initialZoom = getQueryParam('zoom')
            ? parseInt(getQueryParam('zoom'), 10) : 17;

        // Initialize map
        var map = L.map('map').setView(initialCenter, initialZoom);

        // Tile source: the GCS tile-cache endpoint (offline-capable).
        // Qt passes the API base as ?api=http://host:port when loading this file.
        var apiBase = getQueryParam('api');

        // Build the tile URL for a named layer. Through the proxy we always use
        // standard XYZ ({z}/{x}/{y}); the server maps it to each provider's own
        // ordering. Opened standalone (no api), fall back to the provider URL.
        function layerUrl(name, spec) {
            if (apiBase) {
                return apiBase + '/tiles/' + name + '/{z}/{x}/{y}.png';
            }
            return spec.url || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        }

        function prettyName(name) {
            return name.charAt(0).toUpperCase() + name.slice(1);
        }

        // Layer definitions come from config (?layers=<json>). Fall back to a
        // single OSM/street layer if not supplied (e.g. opened standalone).
        var layersParam = getQueryParam('layers');
        var baseLayers = {};
        var overlayLayers = {};
        var startupLayers = [];

        if (layersParam) {
            var specs = JSON.parse(layersParam);
            var overlayZ = 10;  // overlays sit above any base (base stays at 1)
            Object.keys(specs).forEach(function(name) {
                var s = specs[name];
                var layer = L.tileLayer(layerUrl(name, s), {
                    attribution: s.attribution || '',
                    maxZoom: s.max_zoom || 19,
                    maxNativeZoom: s.max_native_zoom || s.max_zoom || 19,
                    // Fixed z-order so switching the base layer via the control
                    // never paints it over the label overlays.
                    zIndex: s.overlay ? overlayZ++ : 1
                });
                if (s.overlay) {
                    overlayLayers[prettyName(name)] = layer;
                } else {
                    baseLayers[prettyName(name)] = layer;
                }
                if (s['default']) { startupLayers.push(layer); }
            });
        }

        if (startupLayers.length === 0) {
            // Fallback: single layer (old behavior / standalone open).
            var fallbackUrl = apiBase
                ? apiBase + '/tiles/{z}/{x}/{y}.png'
                : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
            var fallback = L.tileLayer(fallbackUrl, {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            });
            baseLayers['Street'] = fallback;
            startupLayers.push(fallback);
        }

        // Add startup layers (bases first, then overlays paint on top).
        startupLayers.forEach(function(l) { l.addTo(map); });

        // Layer switcher (top-right), like Google's Map/Satellite toggle.
        if (Object.keys(baseLayers).length > 1 ||
            Object.keys(overlayLayers).length > 0) {
            L.control.layers(baseLayers, overlayLayers,
                {position: 'topright', collapsed: true}).addTo(map);
        }

        // Drone marker with custom icon (blue circle with arrow)
        var droneIcon = L.divIcon({
            className: 'drone-marker',
            html: '<div style="background: #2196F3; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        var droneMarker = L.marker(initialCenter, {icon: droneIcon}).addTo(map);
        var droneHeadingLine = null;

        // Flight path polyline
        var flightPath = L.polyline([], {color: '#2196F3', weight: 3, opacity: 0.7}).addTo(map);
        var pathCoords = [];

        // Detection layers keyed by the server's stable detection identity.
        // Repeated updates (initial/depth retries) replace one clickable point
        // instead of stacking duplicate markers.
        var detectionMarkers = {};

        function detectionKey(data) {
            return String(data.image_file || data.id || data.timestamp ||
                ((data.track_id != null ? data.track_id : 'unknown') + ':' +
                 (data.object_class || data.class || 'object')));
        }

        function removeDetectionLayers(entry) {
            if (!entry) { return; }
            if (entry.marker && map.hasLayer(entry.marker)) {
                map.removeLayer(entry.marker);
            }
            if (entry.line && map.hasLayer(entry.line)) {
                map.removeLayer(entry.line);
            }
        }

        // Update drone position from Qt
        window.updateDronePosition = function(lat, lon, alt, heading) {
            droneMarker.setLatLng([lat, lon]);

            // Update flight path. Keep every point for the whole session, from
            // the moment the link is established until it ends.
            pathCoords.push([lat, lon]);
            flightPath.setLatLngs(pathCoords);

            // Draw heading indicator (line from drone)
            if (droneHeadingLine) {
                map.removeLayer(droneHeadingLine);
            }

            // Calculate endpoint for heading line (50 meters ahead)
            var headingRad = heading * Math.PI / 180;
            var distance = 0.0005; // ~50 meters in degrees
            var endLat = lat + distance * Math.cos(headingRad);
            var endLon = lon + distance * Math.sin(headingRad);

            droneHeadingLine = L.polyline(
                [[lat, lon], [endLat, endLon]],
                {color: '#FF5722', weight: 3, opacity: 0.8}
            ).addTo(map);

            // Keep drone in view (only if near edge)
            var bounds = map.getBounds();
            var ne = bounds.getNorthEast();
            var sw = bounds.getSouthWest();
            var margin = (ne.lat - sw.lat) * 0.2;

            if (lat > ne.lat - margin || lat < sw.lat + margin ||
                lon > ne.lng - margin || lon < sw.lng + margin) {
                map.panTo([lat, lon], {animate: true, duration: 0.5});
            }
        };

        // Helper function to draw bounding box on image
        function drawBoundingBox(imageUrl, bbox, callback) {
            var img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                var canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                var ctx = canvas.getContext('2d');

                // Draw the image
                ctx.drawImage(img, 0, 0);

                // Draw bounding box if provided
                if (bbox && bbox.x1 != null && bbox.y1 != null && bbox.x2 != null && bbox.y2 != null) {
                    ctx.strokeStyle = '#00FF00';  // Green box
                    ctx.lineWidth = 3;
                    ctx.strokeRect(bbox.x1, bbox.y1, bbox.x2 - bbox.x1, bbox.y2 - bbox.y1);

                    // Add semi-transparent background for better visibility
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 5;
                    ctx.globalAlpha = 0.3;
                    ctx.strokeRect(bbox.x1, bbox.y1, bbox.x2 - bbox.x1, bbox.y2 - bbox.y1);
                    ctx.globalAlpha = 1.0;

                    // Draw green box again on top
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(bbox.x1, bbox.y1, bbox.x2 - bbox.x1, bbox.y2 - bbox.y1);
                }

                callback(canvas);
            };
            img.onerror = function() {
                callback(null);
            };
            img.src = imageUrl;
        }

        // Render the detector's equipment_info block for a detection popup.
        // Known fields are shown first, in a deliberate order with their
        // units; anything else the detector adds later is still listed rather
        // than silently dropped, so new metadata needs no change here.
        var EQUIPMENT_FIELDS = [
            ['category', 'Category', ''],
            ['domain', 'Domain', ''],
            ['mobility_type', 'Mobility', ''],
            ['caliber_mm', 'Caliber', ' mm'],
            ['max_range_km', 'Max range', ' km'],
            ['pp_kg', 'PP', ' kg'],
            ['score', 'Score', '']
        ];

        function prettyFieldName(key) {
            return String(key).replace(/_/g, ' ')
                .replace(/^./, function(c) { return c.toUpperCase(); });
        }

        function equipmentInfoHtml(info) {
            if (!info || typeof info !== 'object' || Array.isArray(info)) { return ''; }

            var shown = {name: true};
            var rows = '';

            EQUIPMENT_FIELDS.forEach(function(field) {
                var key = field[0], label = field[1], unit = field[2];
                shown[key] = true;
                var value = info[key];
                if (value === null || value === undefined || value === '') { return; }
                rows += '<div class="equipment-label">' + escapeHtml(label) + '</div>' +
                        '<div class="equipment-value">' + escapeHtml(value) +
                        escapeHtml(unit) + '</div>';
            });

            // Any field the detector starts sending that is not listed above.
            Object.keys(info).forEach(function(key) {
                if (shown[key]) { return; }
                var value = info[key];
                if (value === null || value === undefined || value === '') { return; }
                if (typeof value === 'object') { return; }
                rows += '<div class="equipment-label">' + escapeHtml(prettyFieldName(key)) +
                        '</div><div class="equipment-value">' + escapeHtml(value) + '</div>';
            });

            var name = info.name;
            if (!rows && (name === null || name === undefined || name === '')) { return ''; }

            var html = '<div class="equipment-block">';
            html += '<div class="equipment-title">🛠 ' +
                    escapeHtml(name || 'Equipment') + '</div>';
            if (rows) {
                html += '<div class="equipment-grid">' + rows + '</div>';
            }
            html += '</div>';
            return html;
        }

        // Add detection marker from Qt
        window.addDetection = function(detectionData) {
            var lat = detectionData.latitude;
            var lon = detectionData.longitude;
            var objectClass = detectionData.object_class || detectionData.class;
            var confidence = detectionData.confidence;
            var timestamp = detectionData.timestamp;
            var imageUrl = detectionData.image_url;
            var altitude = detectionData.altitude;
            var distance = (detectionData.depth && detectionData.depth.distance_m != null)
                ? detectionData.depth.distance_m : detectionData.distance_m;
            var bbox = detectionData.bbox;
            var syncTimeDiff = detectionData.sync_time_diff;
            var groundDistance = detectionData.ground_distance;
            var positionSource = detectionData.position_source;
            var equipmentInfo = detectionData.equipment_info;
            var droneLat = detectionData.drone_lat;
            var droneLon = detectionData.drone_lon;
            var droneAlt = detectionData.drone_alt;

            // Detections without a GPS fix can't be placed on the map; skip them
            // (they still appear in the detection panel).
            var hasGps = detectionData.has_gps;
            if (hasGps === undefined) { hasGps = !!(lat || lon); }
            if (!hasGps) { return; }

            var key = detectionKey(detectionData);
            removeDetectionLayers(detectionMarkers[key]);

            // Detection marker icon (red pin)
            var detectionIcon = L.divIcon({
                className: 'detection-marker',
                html: '<div style="background: #F44336; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            var marker = L.marker([lat, lon], {icon: detectionIcon}).addTo(map);

            // Draw line from drone to object if we have drone position
            var projectionLine = null;
            if (droneLat != null && droneLon != null && (droneLat !== lat || droneLon !== lon)) {
                projectionLine = L.polyline(
                    [[droneLat, droneLon], [lat, lon]],
                    {color: '#FFC107', weight: 2, opacity: 0.6, dashArray: '5, 5'}
                ).addTo(map);
            }

            // Build popup content with image and bounding box
            var popupContent = '<div class="detection-popup">';

            if (imageUrl && bbox) {
                // Create a unique ID for this popup's canvas
                var canvasId = 'detection-canvas-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                popupContent += '<div class="image-container"><canvas id="' + canvasId + '"></canvas></div>';
            } else if (imageUrl) {
                popupContent += '<img src="' + imageUrl + '" style="max-width: 300px; max-height: 200px;" />';
            }

            popupContent += '<div class="info">';
            popupContent += '<div class="info-row"><strong>' + objectClass + '</strong> (' + (confidence * 100).toFixed(1) + '%)</div>';

            // What the object IS, straight from the detector, before the
            // where/how-far geometry below.
            popupContent += equipmentInfoHtml(equipmentInfo);

            var timeStr = timestamp ? new Date(timestamp).toLocaleString() : 'Unknown';
            popupContent += '<div class="info-row">📅 Time: ' + timeStr + '</div>';

            popupContent += '<div class="info-row">📍 Object: ' + lat.toFixed(6) + ', ' + lon.toFixed(6) + '</div>';

            if (droneLat != null && droneLon != null) {
                // Say whose position this was projected from: with MAVLink
                // down it is the map's default centre, so the result is an
                // estimate and should not read as a surveyed fix.
                var originLabel = positionSource === 'default_center'
                    ? 'Default centre (no MAVLink fix)' : 'Drone';
                popupContent += '<div class="info-row">🚁 ' + originLabel + ': ' + droneLat.toFixed(6) + ', ' + droneLon.toFixed(6) + '</div>';
            }

            if (droneAlt) {
                popupContent += '<div class="info-row">✈️ Drone Alt: ' + droneAlt.toFixed(1) + ' m</div>';
            }

            if (distance != null) {
                popupContent += '<div class="info-row">📏 Direct Distance: ' + distance.toFixed(2) + ' m</div>';
            }

            if (groundDistance != null && groundDistance !== distance) {
                popupContent += '<div class="info-row">🗺️ Ground Distance: ' + groundDistance.toFixed(2) + ' m</div>';
            }

            if (syncTimeDiff != null) {
                popupContent += '<div class="info-row" style="font-size: 11px; color: #666;">⏱️ Synced (±' + syncTimeDiff.toFixed(1) + 's)</div>';
            }

            popupContent += '</div></div>';

            // Bind popup
            var popup = L.popup({maxWidth: 400}).setContent(popupContent);
            marker.bindPopup(popup);

            // Draw bounding box when popup opens
            if (imageUrl && bbox) {
                marker.on('popupopen', function() {
                    drawBoundingBox(imageUrl, bbox, function(canvas) {
                        if (canvas) {
                            var existingCanvas = document.getElementById(canvasId);
                            if (existingCanvas) {
                                existingCanvas.width = canvas.width;
                                existingCanvas.height = canvas.height;
                                var ctx = existingCanvas.getContext('2d');
                                ctx.drawImage(canvas, 0, 0);
                            }
                        }
                    });
                });
            }

            // Remove projection line when popup closes
            if (projectionLine) {
                marker.on('popupclose', function() {
                    map.removeLayer(projectionLine);
                });
            }

            detectionMarkers[key] = {marker: marker, line: projectionLine};
        };

        // --- Nearby checkpoints ------------------------------------------
        // Checkpoint sets returned by the external /nearby service, keyed by
        // the detection they were looked up for, so a re-query replaces a set
        // instead of leaving the previous markers behind.
        var checkpointLayers = {};

        // Checkpoint data comes from an external service, so never trust it in
        // markup — escape before inserting into a popup.
        function escapeHtml(value) {
            if (value == null) { return ''; }
            return String(value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function removeCheckpointLayers(entry) {
            if (!entry) { return; }
            if (entry.circle && map.hasLayer(entry.circle)) {
                map.removeLayer(entry.circle);
            }
            (entry.markers || []).forEach(function(m) {
                if (map.hasLayer(m)) { map.removeLayer(m); }
            });
        }

        // Pull a latitude/longitude out of a checkpoint however the service
        // happens to name them.
        function checkpointLatLng(cp) {
            var lat = cp.latitude != null ? cp.latitude
                    : (cp.lat != null ? cp.lat : null);
            var lon = cp.longitude != null ? cp.longitude
                    : (cp.lon != null ? cp.lon
                    : (cp.lng != null ? cp.lng : null));
            if (lat == null || lon == null) { return null; }
            lat = Number(lat); lon = Number(lon);
            if (isNaN(lat) || isNaN(lon)) { return null; }
            return [lat, lon];
        }

        // Draw one detection's checkpoint set: the search radius as a circle,
        // plus a marker per checkpoint.
        window.addCheckpoints = function(data) {
            if (!data) { return; }

            var center = data.center || {};
            var lat = Number(center.latitude);
            var lon = Number(center.longitude);
            var radius = Number(data.radius_m);
            if (isNaN(lat) || isNaN(lon)) { return; }

            var key = String(data.key != null ? data.key : 'checkpoints');
            removeCheckpointLayers(checkpointLayers[key]);

            // The search area the radius came from (equipment max range).
            var circle = null;
            if (!isNaN(radius) && radius > 0) {
                circle = L.circle([lat, lon], {
                    radius: radius,
                    color: '#00897B',
                    weight: 2,
                    opacity: 0.8,
                    fillColor: '#00897B',
                    fillOpacity: 0.07,
                    dashArray: '6, 6'
                }).addTo(map);

                var rangeKm = (radius / 1000).toFixed(2);
                circle.bindTooltip(
                    escapeHtml(data.equipment_name || data.object_class ||
                               'equipment') + ' range: ' + rangeKm + ' km',
                    {sticky: true});
            }

            var checkpointIcon = L.divIcon({
                className: 'checkpoint-marker',
                html: '<div style="background: #00897B; width: 14px; height: 14px; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            var markers = [];
            var checkpoints = Array.isArray(data.checkpoints) ? data.checkpoints : [];

            checkpoints.forEach(function(cp) {
                if (!cp || typeof cp !== 'object') { return; }
                var pos = checkpointLatLng(cp);
                if (!pos) { return; }

                var marker = L.marker(pos, {icon: checkpointIcon}).addTo(map);

                var name = cp.name || cp.title || cp.checkpoint_name ||
                           cp.id || 'Checkpoint';
                var html = '<div class="checkpoint-popup">';
                html += '<div class="info-row"><strong>🛡 ' +
                        escapeHtml(name) + '</strong></div>';

                // Whatever the service labels the separation, show it.
                var away = cp.distance_m != null ? cp.distance_m
                         : (cp.distance != null ? cp.distance : null);
                if (away != null && !isNaN(Number(away))) {
                    html += '<div class="info-row">📏 ' +
                            Number(away).toFixed(0) + ' m from object</div>';
                }
                if (cp.type || cp.category) {
                    html += '<div class="info-row">🏷 ' +
                            escapeHtml(cp.type || cp.category) + '</div>';
                }
                html += '<div class="info-row muted">📍 ' +
                        pos[0].toFixed(6) + ', ' + pos[1].toFixed(6) + '</div>';
                html += '</div>';

                marker.bindPopup(html);
                markers.push(marker);
            });

            checkpointLayers[key] = {circle: circle, markers: markers};
        };

        // Remove every checkpoint circle and marker
        window.clearCheckpoints = function() {
            Object.keys(checkpointLayers).forEach(function(key) {
                removeCheckpointLayers(checkpointLayers[key]);
            });
            checkpointLayers = {};
        };

        // Clear all detection markers
        window.clearDetections = function() {
            Object.keys(detectionMarkers).forEach(function(key) {
                removeDetectionLayers(detectionMarkers[key]);
            });
            detectionMarkers = {};
        };

        // Center map on coordinates
        window.centerMap = function(lat, lon, zoom) {
            map.setView([lat, lon], zoom || map.getZoom());
        };

        // Snap to the offline "home" view (AIT campus) when the drone/system
        // goes offline. Called from Qt with the configured center/zoom.
        window.showOfflineView = function(lat, lon, zoom) {
            map.setView([lat, lon], zoom || initialZoom);
        };

        // Clear flight path
        window.clearFlightPath = function() {
            pathCoords = [];
            flightPath.setLatLngs([]);
        };
    </script>
</body>
</html>
